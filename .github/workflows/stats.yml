name: Collect stats

# Hourly: gathers download counts (GitHub) and visits (GoatCounter) into
# stats.json on the "stats" branch, which theshipjava.uk/stats/ reads.
# The branch keeps a single commit, so it never grows.
on:
  schedule:
    - cron: "17 * * * *"   # every hour; GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency: stats

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous stats
        run: git fetch --depth=1 origin stats && git show origin/stats:stats.json > prev.json || echo '{}' > prev.json

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python build/collect_stats.py prev.json stats.json

      - name: Publish to stats branch
        run: |
          mkdir out && mv stats.json out/ && cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stats.json && git commit -qm "Stats $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats
